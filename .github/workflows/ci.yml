name: ci

# Runs on GitHub-hosted runners only (never self-hosted) with a read-only
# token and no secrets; see docs/EXTERNAL-REVIEW.md §1. Never switch this to
# pull_request_target.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # tests/deploy renders deploy/ with the runner's preinstalled kustomize.
      - run: kustomize version
      - run: npm test

  # Checks that the API image builds: the pull-request dry run of
  # publish.yml's build. It runs on pull requests and on main alike, so main
  # runs nothing the pull request did not prove (policy main-stays-green).
  # Publishing to the estate Azure registry (noncelogicci.azurecr.io) happens
  # once per merge to main in publish.yml, on the corpus-ranker-ci self-hosted
  # runner; this job holds no write scope and pushes nothing.
  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t corpus-ranker:ci .

  # The one required status check on main (strict; declared in
  # devops/github/branch-protection.json). It needs every other job in this workflow and passes
  # only when all of them succeeded, so a job added here gates merges once it
  # is listed under needs (tests/deploy/ci-gate.test.ts enforces that).
  ci-result:
    if: always()
    needs: [test, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if [ -z "${RESULTS}" ]; then
            echo "no needed job results" >&2
            exit 1
          fi
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ]; then
              echo "a required job ended '${result}' (results: ${RESULTS})" >&2
              exit 1
            fi
          done
          echo "all required jobs succeeded: ${RESULTS}"

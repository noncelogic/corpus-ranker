name: ci

# Runs on GitHub-hosted runners only (never self-hosted) with a read-only
# token and no secrets; see docs/EXTERNAL-REVIEW.md §1. Never switch this to
# pull_request_target.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # tests/deploy renders deploy/ with the runner's preinstalled kustomize.
      - run: kustomize version
      - run: npm test

  # Checks that the API image builds, on pull requests only. Publishing to
  # GHCR happens once per merge to main in publish.yml, on the self-hosted
  # runners; this job holds no write scope and pushes nothing.
  image:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t corpus-ranker:ci .

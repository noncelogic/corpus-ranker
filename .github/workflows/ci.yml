name: ci

# Runs on GitHub-hosted runners only (never self-hosted) with a read-only
# token and no secrets; see docs/EXTERNAL-REVIEW.md §1. Never switch this to
# pull_request_target.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # tests/deploy renders deploy/ with the runner's preinstalled kustomize.
      - run: kustomize version
      - run: npm test

  # Builds the API image on every run; publishes it to GHCR only on pushes to
  # main. Plain docker CLI, no third-party actions. Publishing is the end of
  # the pipeline: no job here deploys or contacts a cluster (rollout of
  # deploy/ is estate-side GitOps).
  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/noncelogic/corpus-ranker
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${IMAGE}:sha-${GITHUB_SHA}" -t "${IMAGE}:main" .
      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "${IMAGE}:sha-${GITHUB_SHA}"
          docker push "${IMAGE}:main"
          docker logout ghcr.io

name: ci

# Runs on GitHub-hosted runners only (never self-hosted) with a read-only
# token and no secrets; see docs/EXTERNAL-REVIEW.md §1. Never switch this to
# pull_request_target.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # tests/deploy renders deploy/ with the runner's preinstalled kustomize.
      - run: kustomize version
      - run: npm test

  # The required pull-request dry run of publish.yml's `image` job (policy
  # main-stays-green: a main-only job has one). It builds with publish.yml's
  # Build step, verbatim, and the same IMAGE, then checks the tag and the OCI
  # metadata publish would push. It omits only the side effect: it stays on a
  # GitHub-hosted runner with a read-only token, never logs in and pushes
  # nothing. The push credential lives only on the corpus-ranker-ci
  # self-hosted runner, which pull requests must never reach
  # (docs/EXTERNAL-REVIEW.md §1); the Publish step's handling of it is run
  # against stand-ins by tests/deploy/publish-workflow.test.ts in `test`.
  image:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DRY_RUN_OF: image
      IMAGE: noncelogicci.azurecr.io/corpus-ranker
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Must match publish.yml's Build step exactly
      # (tests/deploy/publish-dry-run.test.ts).
      - name: Build
        run: |
          .github/scripts/retry.sh docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${IMAGE}:sha-${GITHUB_SHA}" .
      - name: Check image metadata
        run: |
          labels="$(docker image inspect --format '{{json .Config.Labels}}' "${IMAGE}:sha-${GITHUB_SHA}")"
          for want in \
            "\"org.opencontainers.image.source\":\"https://github.com/${GITHUB_REPOSITORY}\"" \
            "\"org.opencontainers.image.revision\":\"${GITHUB_SHA}\""; do
            case "$labels" in
              *"$want"*) ;;
              *) echo "image ${IMAGE}:sha-${GITHUB_SHA} lacks label ${want}; labels: ${labels}" >&2; exit 1 ;;
            esac
          done
          echo "dry run of publish image: ${IMAGE}:sha-${GITHUB_SHA} built with the labels publish pushes"

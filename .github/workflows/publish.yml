name: publish

# Builds the ranker image once per merge to main and publishes it to GHCR as
# ghcr.io/noncelogic/corpus-ranker:sha-<commit> (and :main).
#
# Runs on the owner's self-hosted runners, which hold estate credentials
# (docs/EXTERNAL-REVIEW.md §1). It is therefore triggered ONLY by pushes to
# main — never by pull_request, pull_request_target or any event external
# code can raise — and authenticates with the repository's own GITHUB_TOKEN,
# scoped to packages: write. Plain docker CLI, no third-party actions.
# Publishing is the end of the pipeline: rollout of deploy/ is estate-side
# GitOps, and nothing here contacts a cluster.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: [self-hosted, linux]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/noncelogic/corpus-ranker
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${IMAGE}:sha-${GITHUB_SHA}" -t "${IMAGE}:main" .
      - name: Publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Private docker config per job: no credential outlives this run on
          # the shared self-hosted host.
          export DOCKER_CONFIG="${RUNNER_TEMP}/docker-config"
          mkdir -p "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "${IMAGE}:sha-${GITHUB_SHA}"
          docker push "${IMAGE}:main"

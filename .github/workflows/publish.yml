name: publish

# Builds the ranker image once per merge to main and publishes it to the
# estate Azure registry as noncelogicci.azurecr.io/corpus-ranker:sha-<commit>
# (INTENTS I21: container images move off GitHub, the ranker first).
#
# Runs on the ranker's dedicated self-hosted runner (labelled [self-hosted,
# aks, corpus-ranker-ci]). It is therefore triggered ONLY by pushes to main —
# never by pull_request, pull_request_target or any event external code can
# raise. The runner mounts no credentials (INTENTS I25; policy
# ci-job-definitions): the job fetches the ranker's own ACR push token
# (corpus-ranker-push, scoped to repository corpus-ranker only; custodied at
# kv/corpus-ranker/acr-push; Rule: policies/placement-defaults.yaml#credentials)
# per run. It mints a GitHub OIDC token (audience openbao), logs in to OpenBao
# at auth/jwt with role corpus-ranker-registry-push — bound to this repository,
# refs/heads/main, push events and this workflow on main — reads the token and
# logs docker in, all inside .github/scripts/estate-registry-credential.mjs,
# which never prints the OIDC token, the OpenBao token or the password. No
# GitHub token is used for the push, so the job holds no `packages`
# permission; `id-token: write` only lets it mint the OIDC token. Plain docker
# CLI; the only actions are GitHub's own checkout and setup-node. Publishing
# is the end of the pipeline: rollout of deploy/ is estate-side GitOps, and
# nothing here contacts a cluster.
on:
  push:
    branches: [main]

permissions: {}

# Deliberately no `concurrency:` group. A group holds at most one pending
# run: with A running and B pending, a third merge C cancels B even under
# `cancel-in-progress: false`, so B's SHA would never be published. Each
# run pushes only its own immutable sha-<commit> tag, so runs for different
# merges never contend and may safely overlap; no moving tag (e.g. :main) is
# pushed, as overlapping runs could leave it pointing at an older commit.

jobs:
  image:
    runs-on: [self-hosted, corpus-ranker-ci]
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: noncelogicci.azurecr.io/corpus-ranker
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build
        # The one build definition ci.yml's `image` job (DRY_RUN_OF: image)
        # proves on every pull request.
        run: |
          . .github/scripts/image-build.sh
          image_build "${IMAGE}:sha-${GITHUB_SHA}"
      # The self-hosted runner image has no node on PATH, and Publish runs
      # estate-registry-credential.mjs with it (every publish from 14095ff to
      # d3fdce7 failed with `node: command not found`, so no sha-<commit>
      # image reached the registry). Same pinned action and Node major as
      # ci.yml. No cache: the job installs no packages.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Publish
        env:
          OPENBAO_ADDR: ${{ vars.OPENBAO_ADDR }}
        run: |
          registry="${IMAGE%%/*}"
          # Private docker config per job: no credential outlives this run on
          # the shared self-hosted host.
          export DOCKER_CONFIG="${RUNNER_TEMP}/docker-config"
          mkdir -p "$DOCKER_CONFIG"
          trap 'docker logout "$registry" >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          # OIDC -> OpenBao JWT role corpus-ranker-registry-push ->
          # kv/data/corpus-ranker/acr-push -> docker login (password on
          # stdin). Refuses a credential for any registry but $registry.
          EXPECTED_REGISTRY="$registry" node .github/scripts/estate-registry-credential.mjs
          docker push "${IMAGE}:sha-${GITHUB_SHA}"

name: publish

# Builds the ranker image once per merge to main and publishes it to the
# estate Azure registry as noncelogicci.azurecr.io/corpus-ranker:sha-<commit>
# (INTENTS I21: container images move off GitHub, the ranker first).
#
# Runs on the ranker's dedicated self-hosted runner (labelled [self-hosted,
# aks, corpus-ranker-ci]). It is therefore triggered ONLY by pushes to main —
# never by pull_request, pull_request_target or any event external code can
# raise. The runner mounts no credentials (INTENTS I25; policy
# ci-job-definitions): the job fetches the ranker's own ACR push token
# (corpus-ranker-push, scoped to repository corpus-ranker only; custodied at
# kv/corpus-ranker/acr-push; Rule: policies/placement-defaults.yaml#credentials)
# per run. It mints a GitHub OIDC token (audience openbao), logs in to OpenBao
# at auth/jwt with role corpus-ranker-registry-push — bound to this repository,
# refs/heads/main, push events and this workflow on main — reads the token and
# logs docker in, all inside .github/scripts/estate-registry-credential.mjs,
# which never prints the OIDC token, the OpenBao token or the password. That
# runs as a preflight before the build, so each merge proves the live
# credential path (or fails naming the unreachable step) first. No
# GitHub token is used for the push, so the job holds no `packages`
# permission; `id-token: write` only lets it mint the OIDC token. Plain docker
# CLI; the only actions are GitHub's own checkout and setup-node. Publishing
# is the end of the pipeline: rollout of deploy/ is estate-side GitOps, and
# nothing here contacts a cluster.
on:
  push:
    branches: [main]

permissions: {}

# Deliberately no `concurrency:` group. A group holds at most one pending
# run: with A running and B pending, a third merge C cancels B even under
# `cancel-in-progress: false`, so B's SHA would never be published. Each
# run pushes only its own immutable sha-<commit> tag, so runs for different
# merges never contend and may safely overlap; no moving tag (e.g. :main) is
# pushed, as overlapping runs could leave it pointing at an older commit.

jobs:
  image:
    runs-on: [self-hosted, corpus-ranker-ci]
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: noncelogicci.azurecr.io/corpus-ranker
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # The self-hosted runner image has no node on PATH, and the credential
      # preflight runs estate-registry-credential.mjs with it (every publish
      # from 14095ff to d3fdce7 failed with `node: command not found`, so no
      # sha-<commit> image reached the registry). Same pinned action and Node
      # major as ci.yml. No cache: the job installs no packages.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # The credential preflight, before any build is spent: the one place
      # the real GitHub OIDC endpoint, OpenBao and the registry are proven
      # reachable with the production credential path. Pull requests run the
      # same script only against stand-ins (tests/ci/registry-credential.test.ts),
      # which proves its protocol, never live reachability; no pull-request
      # job is given OPENBAO_ADDR or an OIDC token (CRANK-219). A failure
      # names the step that could not be reached (oidc, openbao-login,
      # openbao-read, registry-login).
      # Each external call in it is retried with backoff (3 attempts, each
      # HTTP call bounded at 30 s, a 4-minute overall deadline);
      # timeout-minutes is the step's hard bound (CR-PUBLISH-RETRY).
      - name: Registry credential preflight
        timeout-minutes: 6
        env:
          OPENBAO_ADDR: ${{ vars.OPENBAO_ADDR }}
        run: |
          # Private docker config per job, removed by the Log out step: no
          # credential outlives this run on the shared self-hosted host.
          export DOCKER_CONFIG="${RUNNER_TEMP}/docker-config"
          mkdir -p "$DOCKER_CONFIG"
          # OIDC -> OpenBao JWT role corpus-ranker-registry-push ->
          # kv/data/corpus-ranker/acr-push -> docker login (password on
          # stdin). Refuses a credential for any registry but the one IMAGE
          # names.
          EXPECTED_REGISTRY="${IMAGE%%/*}" node .github/scripts/estate-registry-credential.mjs
      # Build and push each run under publish_retry: 3 attempts with
      # exponential backoff, no attempt started past the deadline given, and
      # the step's timeout-minutes as the hard bound; a failure that persists
      # names the operation and the attempts made (CR-PUBLISH-RETRY).
      - name: Build
        # The one build definition ci.yml's `image` job (DRY_RUN_OF: image)
        # proves on every pull request.
        timeout-minutes: 10
        run: |
          . .github/scripts/publish-retry.sh
          . .github/scripts/image-build.sh
          publish_retry build 480 image_build "${IMAGE}:sha-${GITHUB_SHA}"
      - name: Publish
        timeout-minutes: 3
        run: |
          export DOCKER_CONFIG="${RUNNER_TEMP}/docker-config"
          . .github/scripts/publish-retry.sh
          publish_retry push 120 docker push "${IMAGE}:sha-${GITHUB_SHA}"
      - name: Log out
        if: always()
        run: |
          export DOCKER_CONFIG="${RUNNER_TEMP}/docker-config"
          docker logout "${IMAGE%%/*}" >/dev/null 2>&1 || true
          rm -rf "$DOCKER_CONFIG"

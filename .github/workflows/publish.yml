name: publish

# Builds the ranker image once per merge to main and publishes it to the
# estate Azure registry as noncelogicci.azurecr.io/corpus-ranker:sha-<commit>
# (INTENTS I21: container images move off GitHub, the ranker first).
#
# Runs on the ranker's dedicated self-hosted runner (labelled [self-hosted,
# aks, corpus-ranker-ci]), which holds estate credentials
# (docs/EXTERNAL-REVIEW.md §1). It is therefore triggered ONLY by pushes to
# main — never by pull_request, pull_request_target or any event external
# code can raise. It authenticates with the ranker's own ACR push token
# (corpus-ranker-push, scoped to repository corpus-ranker only; custodied at
# kv/corpus-ranker/acr-push; Rule: policies/placement-defaults.yaml#credentials),
# which the runner mounts read-only at /etc/registry-push as the files
# registry, username and password. No GitHub token is used for the push, so
# the job holds no `packages` permission. Plain docker CLI, no third-party
# actions. Publishing is the end of the pipeline: rollout of deploy/ is
# estate-side GitOps, and nothing here contacts a cluster.
on:
  push:
    branches: [main]

permissions: {}

# Deliberately no `concurrency:` group. A group holds at most one pending
# run: with A running and B pending, a third merge C cancels B even under
# `cancel-in-progress: false`, so B's SHA would never be published. Each
# run pushes only its own immutable sha-<commit> tag, so runs for different
# merges never contend and may safely overlap; no moving tag (e.g. :main) is
# pushed, as overlapping runs could leave it pointing at an older commit.

jobs:
  image:
    runs-on: [self-hosted, corpus-ranker-ci]
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      IMAGE: noncelogicci.azurecr.io/corpus-ranker
      REGISTRY_PUSH_DIR: /etc/registry-push
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${IMAGE}:sha-${GITHUB_SHA}" .
      - name: Publish
        run: |
          registry="$(cat "${REGISTRY_PUSH_DIR}/registry")"
          username="$(cat "${REGISTRY_PUSH_DIR}/username")"
          # The mounted credential must be for the registry IMAGE names, or
          # the push would go nowhere (or somewhere else).
          if [ "$registry" != "${IMAGE%%/*}" ]; then
            echo "push credential is for '${registry}', not ${IMAGE%%/*}" >&2
            exit 1
          fi
          # Private docker config per job: no credential outlives this run on
          # the shared self-hosted host.
          export DOCKER_CONFIG="${RUNNER_TEMP}/docker-config"
          mkdir -p "$DOCKER_CONFIG"
          trap 'docker logout "$registry" >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          # The password goes to docker on stdin, never on argv or in the log.
          docker login "$registry" -u "$username" --password-stdin < "${REGISTRY_PUSH_DIR}/password"
          docker push "${IMAGE}:sha-${GITHUB_SHA}"

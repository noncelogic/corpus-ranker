# Generates the ranker's API key set into OpenBao (kv/corpus-ranker/api-keys,
# TECH-STACK §9): an Argo CD Sync hook in wave 6, before the ranker-api-keys
# ExternalSecret (wave 7) syncs the keys for the API (wave 8).
# deploy/api-keys/generate.sh writes one fresh key per principal
# CR-D1-DEC-PRINCIPALS authorises (only `joe`) when the path is empty, keeps an
# existing key set untouched, and never prints a key; every sync re-runs it.
#
# OpenBao is reached with the Job's own service account through the estate's
# Kubernetes auth method; estate-side, role `corpus-ranker-api-keys` is bound to
# this service account in namespace corpus-ranker with create and read on
# kv/data/corpus-ranker/api-keys, nothing else (CR-M3-DEC-KEYGEN-GRANT); the
# role and its policy are recorded in devops/openbao/, and
# tests/deploy/api-keys-job.test.ts holds them.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ranker-api-keys-generate
  annotations:
    argocd.argoproj.io/sync-wave: "2"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ranker-api-keys-generate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "6"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ranker-api-keys-generate
    spec:
      restartPolicy: Never
      serviceAccountName: ranker-api-keys-generate
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: generate
          image: docker.io/openbao/openbao:2.4.1@sha256:597f62847dd382382056a1d6704d50465908c2040038c4611832a23269a67112
          command: ["sh", "/scripts/generate.sh"]
          env:
            - name: BAO_ADDR
              value: http://openbao.openbao.svc.cluster.local:8200
            - name: BAO_K8S_AUTH_MOUNT
              value: kubernetes
            - name: BAO_K8S_AUTH_ROLE
              value: corpus-ranker-api-keys
            - name: BAO_KV_MOUNT
              value: kv
            - name: BAO_KV_PATH
              value: corpus-ranker/api-keys
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: ranker-api-keys-generate
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi

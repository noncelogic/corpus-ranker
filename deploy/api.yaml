# The ranker REST API. Env names are the frozen config contract read by
# src/config.ts; tests/deploy/manifests.test.ts holds them to it. The
# database URL is the ranker_service login role's (database.yaml), never the
# schema owner's.
#
# Every secret the API reads at boot comes from an ExternalSecret
# (externalsecrets.yaml): the API key set and object-store credentials from
# OpenBao under kv/corpus-ranker. The database URL is the one exception: the
# non-refreshing in-cluster ranker-db-password generator sources it. The
# service refuses to start without its API key set or object-store
# credentials (src/config.ts loadServiceConfig);
# tests/deploy/external-secrets.test.ts holds the wiring.
#
# Rollout (CR-D1-PROMOTE): the API is an Argo Rollouts blue/green Rollout
# (TECH-STACK §10, DV-61). A new revision starts behind the preview Service
# (ranker-api-preview); the Rollout switches the active Service (ranker-api,
# the one clients call) to it only once every new pod is Ready, which is when
# its readiness probe GET /readyz answers 200: the database and the object
# store both answer it (src/api/readiness.ts). Auto-promotion has no timer and
# no partial preview, so an unready revision is never promoted and the old
# one keeps serving. Liveness (/healthz) is independent of both dependencies,
# so an outage takes pods out of service without restarting them.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ranker-api
  namespace: corpus-ranker
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    blueGreen:
      activeService: ranker-api
      previewService: ranker-api-preview
      autoPromotionEnabled: true
      # The old revision stays up briefly after the switch, so in-flight
      # requests and endpoint propagation finish against it.
      scaleDownDelaySeconds: 30
  selector:
    matchLabels:
      app.kubernetes.io/name: ranker-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ranker-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ranker-registry-pull
      containers:
        - name: api
          image: noncelogicci.azurecr.io/corpus-ranker
          env:
            - name: RANKER_HOST
              value: 0.0.0.0
            - name: RANKER_PORT
              value: "8080"
            - name: RANKER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ranker-db-service
                  key: uri
            - name: RANKER_S3_ENDPOINT
              value: http://ranker-minio.corpus-ranker.svc.cluster.local:9000
            - name: RANKER_S3_BUCKET
              value: ranker-originals
            # Originals are written to the ranker's own bucket as the ranker
            # service user, the bucket's only writer (CRANK-57), never with
            # the MinIO root credentials (minio-provision-job.yaml); OpenBao
            # kv/corpus-ranker/minio.
            - name: RANKER_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ranker-minio-service
                  key: access-key-id
            - name: RANKER_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ranker-minio-service
                  key: secret-access-key
            # The per-principal API key set (OpenBao kv/corpus-ranker/api-keys),
            # one file per principal, mounted below.
            - name: RANKER_API_KEYS_DIR
              value: /etc/ranker/api-keys
          ports:
            - name: http
              containerPort: 8080
          # Gates promotion: 200 only while the database and the object store
          # both answer, each check bounded at 2s in the service
          # (DEFAULT_READINESS_TIMEOUT_MS), inside this probe's timeout.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: api-keys
              mountPath: /etc/ranker/api-keys
              readOnly: true
      volumes:
        - name: api-keys
          secret:
            secretName: ranker-api-keys
---
# The active Service: estate-internal only (ClusterIP); deliberately no
# Ingress. The Rollout points it at the promoted revision's pods.
apiVersion: v1
kind: Service
metadata:
  name: ranker-api
  namespace: corpus-ranker
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ranker-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# The preview Service: the new revision's pods before promotion, for checks
# against it; estate-internal only.
apiVersion: v1
kind: Service
metadata:
  name: ranker-api-preview
  namespace: corpus-ranker
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ranker-api
  ports:
    - name: http
      port: 8080
      targetPort: http

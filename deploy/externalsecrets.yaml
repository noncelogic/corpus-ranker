# Secrets are materialised by the External Secrets Operator. The API keys,
# MinIO credentials and GHCR pull credential are custodied in OpenBao
# (TECH-STACK §9) and read through the estate ClusterSecretStore `openbao`;
# the API keys and the MinIO service user's credentials are written there by
# the ranker's own Sync hook Jobs, the rest estate-side. The database role passwords are generated in-cluster (below).
# Nothing secret lives in git.
# The API key set, which the ranker-api-keys-generate Job (wave 6,
# api-keys-job.yaml) writes to kv/corpus-ranker/api-keys when that path is
# empty. Wave 7, after the Job, so the first sync finds the keys; the API
# (wave 8) reads them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ranker-api-keys
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ranker-api-keys
    creationPolicy: Owner
  # Per-agent API keys (one property per agent principal), mounted into the
  # API as files under /etc/ranker/api-keys (RANKER_API_KEYS_DIR). Generated
  # into OpenBao, never echoed, by deploy/api-keys/generate.sh (the Job above).
  dataFrom:
    - extract:
        key: corpus-ranker/api-keys
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ranker-minio
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ranker-minio
    creationPolicy: Owner
  data:
    - secretKey: MINIO_ROOT_USER
      remoteRef:
        key: corpus-ranker/minio
        property: root-user
    - secretKey: MINIO_ROOT_PASSWORD
      remoteRef:
        key: corpus-ranker/minio
        property: root-password
---
# The ranker service user's MinIO credentials: the bucket's only writer
# (CRANK-57), which the ranker-minio-provision Job (wave 6) creates and
# publishes to kv/corpus-ranker/minio next to the root credentials. Wave 7,
# after the Job, so the first sync finds the properties; the API (wave 8)
# reads them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ranker-minio-service
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ranker-minio-service
    creationPolicy: Owner
  data:
    - secretKey: access-key-id
      remoteRef:
        key: corpus-ranker/minio
        property: service-user
    - secretKey: secret-access-key
      remoteRef:
        key: corpus-ranker/minio
        property: service-password
---
# Pull credential for the ranker image (noncelogicci.azurecr.io/corpus-ranker),
# in the estate Azure registry (INTENTS I21). The remote key holds the
# ranker's own ACR token corpus-ranker-pull, pull-only and scoped to
# repository corpus-ranker (Rule: policies/placement-defaults.yaml#credentials);
# the estate External Secrets role reads kv/corpus-ranker/acr-pull. Every
# workload that runs the ranker image lists this Secret in imagePullSecrets
# (tests/deploy/image-pull.test.ts).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ranker-registry-pull
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ranker-registry-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"noncelogicci.azurecr.io":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}'
  data:
    - secretKey: username
      remoteRef:
        key: corpus-ranker/acr-pull
        property: username
    - secretKey: password
      remoteRef:
        key: corpus-ranker/acr-pull
        property: password
---
# Database credentials (database.yaml). Both are basic-auth Secrets as CNPG
# requires: `ranker-db-migrator` is the initdb owner's secret, used only by the
# migration Job; `ranker-db-service` is the managed service role's password
# and also carries the API's connection string under `uri`.
#
# Unlike the API keys above, these passwords are not custodied in OpenBao:
# each is generated once, in-cluster, by the `ranker-db-password` Password
# generator, so the first Argo sync needs nothing written by hand. With
# `refreshInterval: "0"` ESO never regenerates them on a timer; a Secret is
# only (re)generated when its ExternalSecret is created or its spec changes,
# so edit these two resources deliberately.
#
# Lifecycle: with `creationPolicy: Owner` each Secret is owned by its
# ExternalSecret, so deleting (or renaming) an ExternalSecret lets Kubernetes
# garbage-collect its Secret, and recreating it generates a NEW password,
# which CNPG then applies to the role: deleting either ExternalSecret rotates
# that role's password. `deletionPolicy: Retain` does not prevent this; it
# covers only data deleted on the provider side (ESO
# ownership-deletion-policy guide).
# Each ExternalSecret gets its own value from the shared generator.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ranker-db-password
  annotations:
    # A wave ahead of the ExternalSecrets that draw on it.
    argocd.argoproj.io/sync-wave: "1"
spec:
  length: 40
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ranker-db-migrator
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: "0"
  target:
    name: ranker-db-migrator
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: ranker_migrator
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ranker-db-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ranker-db-service
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: "0"
  target:
    name: ranker-db-service
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: ranker_service
        password: "{{ .password }}"
        uri: 'postgresql://ranker_service:{{ .password | urlquery | replace "+" "%20" }}@ranker-db-rw.corpus-ranker.svc:5432/ranker?sslmode=require'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ranker-db-password

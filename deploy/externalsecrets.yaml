# Secrets are materialised by the External Secrets Operator. The API keys and
# MinIO credentials are custodied in OpenBao (TECH-STACK §9) and read through
# the estate ClusterSecretStore `openbao`; their remote keys are created
# estate-side. The database role passwords are generated in-cluster (below).
# Nothing secret lives in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ranker-api-keys
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ranker-api-keys
    creationPolicy: Owner
  # Per-agent API keys (one property per agent principal), mounted into the
  # API as files under /etc/ranker/api-keys.
  dataFrom:
    - extract:
        key: corpus-ranker/api-keys
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ranker-minio
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ranker-minio
    creationPolicy: Owner
  data:
    - secretKey: MINIO_ROOT_USER
      remoteRef:
        key: corpus-ranker/minio
        property: root-user
    - secretKey: MINIO_ROOT_PASSWORD
      remoteRef:
        key: corpus-ranker/minio
        property: root-password
---
# Database credentials (database.yaml). Both are basic-auth Secrets as CNPG
# requires: `ranker-db-migrator` is the initdb owner's secret, used only by the
# migration Job; `ranker-db-service` is the managed service role's password
# and also carries the API's connection string under `uri`.
#
# Unlike the API keys above, these passwords are not custodied in OpenBao:
# each is generated once, in-cluster, by the `ranker-db-password` Password
# generator, so the first Argo sync needs nothing written by hand. With
# `refreshInterval: "0"` ESO never regenerates them on a timer; a Secret is
# only (re)generated when its ExternalSecret is created or its spec changes,
# so edit these two resources deliberately. `deletionPolicy: Retain` keeps
# the Secret (and so the role's password) if the ExternalSecret is removed.
# Each ExternalSecret gets its own value from the shared generator.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ranker-db-password
spec:
  length: 40
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ranker-db-migrator
spec:
  refreshInterval: "0"
  target:
    name: ranker-db-migrator
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: ranker_migrator
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ranker-db-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ranker-db-service
spec:
  refreshInterval: "0"
  target:
    name: ranker-db-service
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: ranker_service
        password: "{{ .password }}"
        uri: 'postgresql://ranker_service:{{ .password | urlquery | replace "+" "%20" }}@ranker-db-rw.corpus-ranker.svc:5432/ranker?sslmode=require'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ranker-db-password

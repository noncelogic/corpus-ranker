# Secrets are custodied in OpenBao (TECH-STACK §9) and materialised by the
# External Secrets Operator through the estate ClusterSecretStore `openbao`.
# The remote keys below are created estate-side; nothing secret lives in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ranker-api-keys
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ranker-api-keys
    creationPolicy: Owner
  # Per-agent API keys (one property per agent principal), mounted into the
  # API as files under /etc/ranker/api-keys.
  dataFrom:
    - extract:
        key: corpus-ranker/api-keys
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ranker-minio
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ranker-minio
    creationPolicy: Owner
  data:
    - secretKey: MINIO_ROOT_USER
      remoteRef:
        key: corpus-ranker/minio
        property: root-user
    - secretKey: MINIO_ROOT_PASSWORD
      remoteRef:
        key: corpus-ranker/minio
        property: root-password

# Secrets are custodied in OpenBao (TECH-STACK §9) and materialised by the
# External Secrets Operator through the estate ClusterSecretStore `openbao`.
# The remote keys below are created estate-side; nothing secret lives in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ranker-api-keys
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ranker-api-keys
    creationPolicy: Owner
  # Per-agent API keys (one property per agent principal), mounted into the
  # API as files under /etc/ranker/api-keys.
  dataFrom:
    - extract:
        key: corpus-ranker/api-keys
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ranker-minio
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ranker-minio
    creationPolicy: Owner
  data:
    - secretKey: MINIO_ROOT_USER
      remoteRef:
        key: corpus-ranker/minio
        property: root-user
    - secretKey: MINIO_ROOT_PASSWORD
      remoteRef:
        key: corpus-ranker/minio
        property: root-password
---
# Database credentials (database.yaml). Both are basic-auth Secrets as CNPG
# requires: `ranker-db-migrator` is the initdb owner's secret, used only by the
# migration Job; `ranker-db-service` is the managed service role's password
# and also carries the API's connection string under `uri`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ranker-db-migrator
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ranker-db-migrator
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: ranker_migrator
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: corpus-ranker/db-migrator
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ranker-db-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: ranker-db-service
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: ranker_service
        password: "{{ .password }}"
        uri: 'postgresql://ranker_service:{{ .password | urlquery | replace "+" "%20" }}@ranker-db-rw.corpus-ranker.svc:5432/ranker?sslmode=require'
  data:
    - secretKey: password
      remoteRef:
        key: corpus-ranker/db-service
        property: password

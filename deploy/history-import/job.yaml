# Opt-in backfill of the checksummed Juno export. Never part of normal Argo sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: ranker-juno-history-import
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ranker-juno-history-import
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ranker-registry-pull
      initContainers:
        - name: verify
          image: noncelogicci.azurecr.io/corpus-ranker
          command: ["sh", "-c", "cd /import && sha256sum -c SHA256SUMS"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: export
              mountPath: /import
              readOnly: true
      containers:
        - name: import
          image: noncelogicci.azurecr.io/corpus-ranker
          command: ["node", "dist/import/juno-historical-import.js"]
          env:
            - name: RANKER_IMPORT_DIR
              value: /import
            - name: RANKER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ranker-db-service
                  key: uri
            - name: RANKER_S3_ENDPOINT
              value: http://ranker-minio.corpus-ranker.svc.cluster.local:9000
            - name: RANKER_S3_BUCKET
              value: ranker-originals
            # Originals are written to the ranker's own bucket as the ranker
            # service user, the bucket's only writer (CRANK-57), never with
            # the MinIO root credentials (minio-provision-job.yaml); OpenBao
            # kv/corpus-ranker/minio.
            - name: RANKER_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ranker-minio-service
                  key: access-key-id
            - name: RANKER_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ranker-minio-service
                  key: secret-access-key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: export
              mountPath: /import
              readOnly: true
      volumes:
        - name: export
          persistentVolumeClaim:
            claimName: juno-papers-export
            readOnly: true

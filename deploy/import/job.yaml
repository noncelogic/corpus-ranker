# One-shot import of Juno's export (PVC juno-papers-export, staged read-only:
# papers-2026-W41.jsonl .. papers-2026-W47.jsonl, registry.json, SHA256SUMS)
# into the ranker through its API (src/import/corpus-import-job.ts).
#
# The init container `verify` runs `sha256sum -c SHA256SUMS` in /import; the
# importer cannot start unless it passes, and re-checks the sums itself before
# posting anything. Each record is captured (content-addressed: a re-run
# creates no duplicate Originals), then its paper-rubric v1 score posted with
# the scorer and date from the file. Juno's weekly records name neither
# (relevance / technical_merit are top-level numbers): they are scored with
# the declared scorer below and scored_at = first_seen, the date of the
# aggregation run whose triage lanes scored them. The provenance is stated as
# reconstructed; the per-run triage outputs, merge summaries and run logs stay
# on Juno's host. The log holds counts only, never record
# contents; any failed post fails the Job. backoffLimit 0: a failed run is
# looked at, not retried, since a retry would post every score again.
#
# The export is private research data: mounted here, never committed.
apiVersion: batch/v1
kind: Job
metadata:
  name: ranker-corpus-import
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ranker-corpus-import
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ranker-registry-pull
      initContainers:
        - name: verify
          image: noncelogicci.azurecr.io/corpus-ranker
          command: ["sh", "-c", "cd /import && sha256sum -c SHA256SUMS"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: export
              mountPath: /import
              readOnly: true
      containers:
        - name: import
          image: noncelogicci.azurecr.io/corpus-ranker
          command: ["node", "dist/import/corpus-import-job.js"]
          env:
            - name: RANKER_IMPORT_DIR
              value: /import
            - name: RANKER_API_URL
              value: http://ranker-api.corpus-ranker.svc.cluster.local:8080
            - name: RANKER_CORPUS_ID
              value: cr_corpus_papers
            - name: RANKER_IMPORT_CAPTURED_BY
              value: agent:corpus-import
            # Scorer for records that name none (Juno's weekly shape).
            - name: RANKER_IMPORT_DECLARED_SCORER
              value: '{"identity":"juno:weekly-aggregation-triage","config":{"rubric":"paper-rubric v1","scored_at_from":"first_seen","provenance":"reconstructed"}}'
            # The owner's principal, the only key CR-D1-DEC-PRINCIPALS
            # authorises (OpenBao kv/corpus-ranker/api-keys).
            - name: RANKER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ranker-api-keys
                  key: joe
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: export
              mountPath: /import
              readOnly: true
      volumes:
        - name: export
          persistentVolumeClaim:
            claimName: juno-papers-export
            readOnly: true

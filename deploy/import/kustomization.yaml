# CR-M3-D1-JOB: the one-shot Job ranker-corpus-import (job.yaml) loading
# Juno's staged weekly papers into the deployed ranker (SPEC A7 Phase 0).
#
# A kustomize Component, deliberately not listed in deploy/kustomization.yaml:
# a normal Argo CD sync never renders or runs it. An operator runs it once
# (CRANK-95), rendered with the published sha-<commit> image tag:
#
#   node deploy/opt-in-job.ts corpus-import sha-<40-hex commit> | kubectl apply -n corpus-ranker -f -
#
# which includes it in a throwaway overlay setting the namespace and the
# ranker image's newTag. The component names no tag of its own: publish.yml
# pushes only sha-<commit>, never a moving tag such as :main.
#
# tests/deploy/corpus-import-job.test.ts holds the Job.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
labels:
  - pairs:
      app.kubernetes.io/part-of: corpus-ranker
    includeSelectors: false
resources:
  - job.yaml

# Corpus Ranker on aks-obs-01 (TECH-STACK §10): one namespace, the ranker's
# own CNPG Postgres cluster (pgvector) with its migration Job, MinIO with
# the Job provisioning its bucket and writer, the API (an Argo Rollouts
# blue/green Rollout), and ExternalSecrets: API keys and MinIO credentials
# from the estate OpenBao ClusterSecretStore, database passwords generated in-cluster.
#
# Manifests only. No CI step applies these; rollout is estate-side GitOps:
# the estate Argo CD Application argocd/corpus-ranker (meta-harness
# devops/aks/corpus-ranker-argo/application.yaml: AppProject corpus-ranker,
# prune off, the image pin and the OpenBao Job patches) tracks this overlay
# on aks-obs-01 and is its one definition. This overlay renders no
# Application (CR-ARGO-APP-OUT): AppProject corpus-ranker permits only
# namespace corpus-ranker, and a repo-side Application would replace the
# estate spec. Render locally with:  kustomize build deploy/
#
# Every rendered namespaced object is in namespace corpus-ranker, set
# explicitly on each resource (tests/deploy/rollout-manifests.test.ts).
# No Ingress: the API is reachable estate-internally via its ClusterIP Service.
#
# Argo CD sync waves (argocd.argoproj.io/sync-wave) order one full sync of an
# empty namespace so every prerequisite exists before its consumer:
#   0  the Namespace
#   1  the Password generator
#   2  the ExternalSecrets (one draws on the generator) and ConfigMaps
#   3  the CNPG Cluster (ranker-db)
#   4  the migration Job (a Sync hook; migrate-job.yaml)
#   5  MinIO
#   6  the Jobs writing the ranker's own credentials to OpenBao (Sync hooks):
#      the MinIO provisioning Job (minio-provision-job.yaml: the bucket, its
#      only writer, that writer's credentials) and the API key Job
#      (api-keys-job.yaml: the key set, when kv/corpus-ranker/api-keys is empty)
#   7  the ExternalSecrets syncing what they wrote (ranker-minio-service,
#      ranker-api-keys)
#   8  the API: its active and preview Services and its blue/green Rollout,
#      which promotes a revision only once its readiness probe (/readyz: the
#      database and the object store answer) passes
# then, after every wave is synced and healthy, the PostSync hook Job
# ranker-db-check (dbcheck-job.yaml) logs in with each generated database
# role secret and fails the sync if a secret is missing or a login is refused.
# tests/deploy/sync-waves.test.ts holds every reference to this order.
# The API (wave 8) starts only after every ExternalSecret it reads reports
# Ready (Argo CD's ExternalSecret health check gates each wave), so it never
# boots without its secrets; tests/deploy/sync-order.test.ts holds that.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: corpus-ranker
    includeSelectors: false
resources:
  - namespace.yaml
  - externalsecrets.yaml
  - database.yaml
  - migrate-job.yaml
  - minio.yaml
  - minio-provision-job.yaml
  - api-keys-job.yaml
  - api.yaml
  - dbcheck-job.yaml
# CNPG bootstrap SQL and the migration script, kept as plain files so the
# schema tests run exactly what deploys. Fixed names: the Cluster refers to
# its ConfigMap from a CRD field kustomize cannot rewrite.
configMapGenerator:
  - name: ranker-db-bootstrap
    files:
      - db/bootstrap.sql
    namespace: corpus-ranker
    options:
      disableNameSuffixHash: true
      annotations:
        argocd.argoproj.io/sync-wave: "2"
  - name: ranker-db-migrate
    files:
      - db/migrate.sh
    namespace: corpus-ranker
    options:
      disableNameSuffixHash: true
      annotations:
        argocd.argoproj.io/sync-wave: "2"
  - name: ranker-db-check
    files:
      - db/dbcheck.sh
    namespace: corpus-ranker
    options:
      disableNameSuffixHash: true
      annotations:
        argocd.argoproj.io/sync-wave: "2"
  # The MinIO provisioning script and the bucket's writer policy (minio-provision-job.yaml).
  - name: ranker-minio-provision
    files:
      - minio/provision.sh
      - minio/writer-policy.json
    namespace: corpus-ranker
    options:
      disableNameSuffixHash: true
      annotations:
        argocd.argoproj.io/sync-wave: "2"
  # The API key generator (api-keys-job.yaml).
  - name: ranker-api-keys-generate
    files:
      - api-keys/generate.sh
    namespace: corpus-ranker
    options:
      disableNameSuffixHash: true
      annotations:
        argocd.argoproj.io/sync-wave: "2"
images:
  # .github/workflows/publish.yml publishes noncelogicci.azurecr.io/corpus-ranker:sha-<commit>
  # for every merge. Estate-side GitOps pins the tag (or digest) it rolls out here.
  - name: noncelogicci.azurecr.io/corpus-ranker
    newTag: main

# The ranker's S3-compatible object store (TECH-STACK §5): the estate's one
# MinIO deployment for the ranker (TECH-STACK §10, §11), on a PVC. It only
# serves; the `ranker-originals` bucket, its writer policy and the ranker
# service user are provisioned by the ranker-minio-provision Job
# (minio-provision-job.yaml, wave 6). Root credentials come from the
# `ranker-minio` ExternalSecret and are used by that Job alone.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ranker-minio-data
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: managed-csi-premium
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ranker-minio
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  replicas: 1
  # ReadWriteOnce volume: never run two pods against it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ranker-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ranker-minio
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: ranker-minio
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ranker-minio
                  key: MINIO_ROOT_PASSWORD
          command: ["minio"]
          args: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ranker-minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: ranker-minio
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ranker-minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
